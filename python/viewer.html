<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Webcam viewer</title>
<style>
:root{--bg:#0b0d10;--card:#151a20;--line:#252c35;--fg:#e8edf2;--dim:#8a96a3;--acc:#3ea6ff;--red:#ff4d4d;--grn:#3ddc84}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font:15px/1.4 system-ui,sans-serif}
body{display:grid;grid-template-columns:1fr 320px;grid-template-rows:auto 1fr;grid-template-areas:"top top" "view side"}
@media(max-width:800px){body{grid-template-columns:1fr;grid-template-rows:auto 50vh auto;grid-template-areas:"top" "view" "side"}}
header{grid-area:top;display:flex;gap:12px;align-items:center;padding:8px 14px;border-bottom:1px solid var(--line)}
header b{margin-right:auto}
.dot{width:10px;height:10px;border-radius:50%;background:#666;display:inline-block}.dot.on{background:var(--grn)}.dot.wait{background:#ffb020}
.dim{color:var(--dim)}
#view{grid-area:view;position:relative;background:#000;min-height:0}
canvas{width:100%;height:100%;object-fit:contain;display:block}
#msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--dim);font-size:18px;text-align:center;padding:20px;pointer-events:none}
#rec{position:absolute;left:12px;top:10px;background:var(--red);padding:2px 10px;border-radius:12px;font-weight:600}
#toast{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);background:#000c;padding:6px 14px;border-radius:16px}
aside{grid-area:side;overflow:auto;border-left:1px solid var(--line);padding:10px}
.row{display:flex;gap:8px;margin-bottom:8px}
button{flex:1;font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:9px 6px;cursor:pointer}
button:hover:not(:disabled){border-color:var(--acc)}button:disabled{opacity:.4;cursor:default}
button.rec{background:var(--red);border-color:var(--red)}
details{background:var(--card);border:1px solid var(--line);border-radius:10px;margin:8px 0;padding:0 10px}
summary{padding:9px 0;font-weight:600;cursor:pointer}
label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--dim);margin-bottom:10px}
label.chk{flex-direction:row;align-items:center;gap:8px;color:var(--fg);font-size:14px}
input,select{font:inherit;color:var(--fg);background:#0e1216;border:1px solid var(--line);border-radius:6px;padding:6px;min-width:0}
input[type=range]{padding:0}
</style>
</head>
<body>
<header>
  <b>📷 Webcam viewer</b>
  <span><span id="dot" class="dot"></span> <span id="status">connecting…</span></span>
  <span id="info" class="dim"></span>
</header>

<section id="view">
  <canvas id="cv"></canvas>
  <div id="msg">Connecting to hub…</div>
  <div id="rec" hidden>● REC <span id="rt">0:00</span></div>
  <div id="toast" hidden></div>
</section>

<aside>
  <div class="row">
    <button id="bSnap" title="Space">📷 Snap</button>
    <button id="bRec" title="R">⏺ Record</button>
  </div>
  <div class="row">
    <button id="bGet" disabled>⬇ Get last recording</button>
    <button id="bFull">⛶</button>
  </div>

  <details open><summary>Camera</summary>
    <label>Facing <select id="facing"><option value="environment">Back</option><option value="user">Front</option></select></label>
    <label>Resolution <select id="res"><option>640x480</option><option>1280x720</option><option>1920x1080</option><option>3840x2160</option></select></label>
    <label>Frame rate <select id="fps"><option>15</option><option>24</option><option>30</option><option>60</option></select></label>
    <label class="chk"><input id="audio" type="checkbox"> Record microphone</label>
    <div id="adv"></div>
  </details>
  <details><summary>Recording</summary>
    <label>Bitrate <select id="bitrate"><option value="low">Low 1 Mbps</option><option value="medium">Medium 2.5 Mbps</option><option value="high">High 5 Mbps</option><option value="max">Max 10 Mbps</option></select></label>
    <label>Codec <select id="codec"><option value="auto">Auto</option><option value="h264">H.264 mp4</option><option value="vp9">VP9 webm</option></select></label>
  </details>
  <details><summary>Live stream</summary>
    <label class="chk"><input id="stream" type="checkbox"> Send preview frames</label>
    <label>Stream fps <input id="streamFps" type="number" min="1" max="30"></label>
    <label>Stream width <input id="streamWidth" type="number" min="160" max="3840" step="10"></label>
    <label>JPEG quality <input id="streamQuality" type="range" min="0.1" max="1" step="0.05"></label>
    <label>Snapshot quality <input id="snapQuality" type="range" min="0.5" max="1" step="0.01"></label>
  </details>
  <p class="dim" style="font-size:12px">Mirrors the phone: changes made here or on the phone show up on both. Snapshots and recordings download in this browser.</p>
</aside>

<script>
const $ = (s) => document.querySelector(s);
const token = new URLSearchParams(location.search).get('token') || '';
let ws, state = {}, phoneUp = false, capsKey = '', frames = 0, decoding = false, lastFrameAt = 0;
let nextId = 0x40000000, wantSnap = new Set(), wantRec = new Set(), recParts = {}, recTick, recInfo = {};
const cv = $('#cv'), ctx = cv.getContext('2d');
const stamp = () => new Date().toISOString().replace(/[-:]/g, '').replace('T', '-').slice(0, 15);
function toast(t, ms = 3000) { const e = $('#toast'); e.textContent = t; e.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => (e.hidden = true), ms); }
function save(blob, name) { const a = Object.assign(document.createElement('a'), { href: URL.createObjectURL(blob), download: name }); document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 30000); }
const send = (o) => ws && ws.readyState === 1 && ws.send(JSON.stringify(o));
const set = (settings) => send({ t: 'set', settings });

function connect() {
  ws = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/ui?token=${encodeURIComponent(token)}`);
  ws.binaryType = 'arraybuffer';
  ws.onopen = () => { $('#dot').className = 'dot wait'; $('#status').textContent = 'hub connected'; };
  ws.onclose = (e) => {
    $('#dot').className = 'dot'; phoneUp = false; render();
    if (e.code === 4401) { $('#status').textContent = 'bad token — use the URL printed by the hub'; return; }
    $('#status').textContent = 'reconnecting…'; setTimeout(connect, 1500);
  };
  ws.onmessage = (ev) => (typeof ev.data === 'string' ? onJSON(JSON.parse(ev.data)) : onBin(new Uint8Array(ev.data)));
}

function onJSON(m) {
  switch (m.t) {
    case 'phone': phoneUp = m.connected; if (m.name) state.name = m.name; if (!phoneUp) recInfo = {}; render(); break;
    case 'state': state = { ...state, ...m }; render(); break;
    case 'rec_status': recInfo = m; renderRec(); break;
    case 'rec_file_end': if (wantRec.has(m.id)) finishRec(m); break;
    case 'error': toast('Phone: ' + m.msg); break;
  }
}
async function onBin(b) {
  const kind = b[0];
  if (kind === 1) {
    if (decoding) return; decoding = true;
    try {
      const bmp = await createImageBitmap(new Blob([b.subarray(1)], { type: 'image/jpeg' }));
      if (cv.width !== bmp.width || cv.height !== bmp.height) { cv.width = bmp.width; cv.height = bmp.height; }
      ctx.drawImage(bmp, 0, 0); bmp.close(); frames++; lastFrameAt = performance.now(); $('#msg').hidden = true;
    } catch {} finally { decoding = false; }
  } else if (kind === 2) {
    const id = new DataView(b.buffer, b.byteOffset).getUint32(1);
    if (wantSnap.delete(id)) { save(new Blob([b.subarray(5)], { type: 'image/jpeg' }), `snap-${stamp()}.jpg`); toast('Snapshot saved'); }
  } else if (kind === 3) {
    const dv = new DataView(b.buffer, b.byteOffset), id = dv.getUint32(1), idx = dv.getUint32(5);
    if (wantRec.has(id)) (recParts[id] ||= {})[idx] = b.slice(9);
  }
}
function finishRec(m) {
  wantRec.delete(m.id); const parts = recParts[m.id] || {}; delete recParts[m.id];
  const list = []; for (let i = 0; i < m.chunks; i++) if (parts[i]) list.push(parts[i]);
  const blob = new Blob(list, { type: m.mime });
  if (blob.size !== m.size) return toast('Recording incomplete — try again');
  save(blob, m.name); toast(`Recording saved (${(m.size / 1e6).toFixed(1)} MB)`); $('#bGet').disabled = false;
}

// ---- UI mirroring ----
const ADV = ['zoom', 'torch', 'exposureMode', 'exposureCompensation', 'exposureTime', 'focusMode', 'focusDistance', 'whiteBalanceMode', 'colorTemperature', 'iso', 'brightness', 'contrast', 'saturation', 'sharpness'];
function setVal(el, v) { if (v === undefined || document.activeElement === el) return; if (el.type === 'checkbox') el.checked = !!v; else el.value = v; }
function render() {
  const s = state.settings || {};
  $('#dot').className = 'dot ' + (phoneUp ? 'on' : 'wait');
  $('#status').textContent = phoneUp ? `phone: ${state.name || 'connected'}` : 'waiting for phone…';
  const v = state.video || {}; $('#info').textContent = v.w ? `${v.w}×${v.h} @${Math.round(v.fps || 0)} · ${frames} frames` : '';
  $('#msg').hidden = phoneUp && performance.now() - lastFrameAt < 3000;
  $('#msg').textContent = phoneUp ? 'Waiting for video…' : 'Waiting for the phone to connect…';
  for (const k of ['facing', 'res', 'fps', 'audio', 'bitrate', 'codec', 'streamFps', 'streamWidth', 'streamQuality', 'snapQuality']) setVal($('#' + k), s[k]);
  setVal($('#stream'), state.streaming);
  buildAdv(); renderRec();
}
function buildAdv() {
  const caps = state.caps || {}, s = state.settings || {}, key = JSON.stringify(caps);
  const box = $('#adv');
  if (key !== capsKey) {                       // rebuild only when the device's capabilities change
    capsKey = key; box.innerHTML = '';
    for (const k of ADV) {
      const c = caps[k]; if (c === undefined) continue;
      const lab = document.createElement('label'); let inp;
      if (typeof c === 'boolean' || (Array.isArray(c) && c.every((x) => typeof x === 'boolean'))) {
        lab.className = 'chk'; inp = Object.assign(document.createElement('input'), { type: 'checkbox' }); inp.onchange = () => set({ [k]: inp.checked }); lab.append(inp, k);
      } else if (Array.isArray(c)) {
        inp = document.createElement('select'); c.forEach((o) => inp.add(new Option(o, o))); inp.onchange = () => set({ [k]: inp.value }); lab.append(k, inp);
      } else if (c && typeof c === 'object' && 'min' in c) {
        inp = Object.assign(document.createElement('input'), { type: 'range', min: c.min, max: c.max, step: c.step || (c.max - c.min) / 100 }); inp.onchange = () => set({ [k]: Number(inp.value) }); lab.append(k, inp);
      } else continue;
      inp.dataset.k = k; box.append(lab);
    }
  }
  box.querySelectorAll('[data-k]').forEach((el) => setVal(el, s[el.dataset.k]));
}
function renderRec() {
  const on = recInfo.state === 'recording';
  $('#rec').hidden = !on; $('#bRec').classList.toggle('rec', on); $('#bRec').textContent = on ? '⏹ Stop' : '⏺ Record';
  const t = Math.floor(recInfo.elapsed || 0); $('#rt').textContent = `${Math.floor(t / 60)}:${String(t % 60).padStart(2, '0')}`;
  $('#bGet').disabled = !(recInfo.last && !on);
}

// ---- actions ----
const snap = () => { const id = nextId++; wantSnap.add(id); send({ t: 'snap', id }); };
const toggleRec = () => send({ t: 'rec', action: recInfo.state === 'recording' ? 'stop' : 'start' });
$('#bSnap').onclick = snap;
$('#bRec').onclick = toggleRec;
$('#bGet').onclick = () => { if (recInfo.last) { wantRec.add(recInfo.last.id); toast('Fetching recording…'); send({ t: 'rec', action: 'send', id: recInfo.last.id }); } };
$('#bFull').onclick = () => ($('#view').requestFullscreen ? $('#view').requestFullscreen() : 0);
addEventListener('keydown', (e) => { if (/INPUT|SELECT/.test(e.target.tagName)) return; if (e.code === 'Space') { e.preventDefault(); snap(); } if (e.key === 'r') toggleRec(); });
for (const k of ['facing', 'res', 'fps', 'bitrate', 'codec']) $('#' + k).onchange = (e) => set({ [k]: k === 'fps' ? Number(e.target.value) : e.target.value });
$('#audio').onchange = (e) => set({ audio: e.target.checked });
for (const k of ['streamFps', 'streamWidth', 'streamQuality', 'snapQuality']) $('#' + k).onchange = (e) => set({ [k]: Number(e.target.value) });
$('#stream').onchange = (e) => send({ t: 'stream', on: e.target.checked });
setInterval(() => { render(); }, 1000);
connect();
</script>
</body>
</html>
